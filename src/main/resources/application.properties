spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservahub}
spring.datasource.username='digite_aqui_seu_usuario'
spring.datasource.password='digite_aqui_sua_senha'

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Preencha com uma chave secreta forte para o JWT
# jwt.secret=SUA_CHAVE_SECRETA

jwt.secret=${JWT_SECRET: digite_aqui_sua_chave_secreta}
jwt.expiracao-minutos=60

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

Upload de imagens de produtos
app.upload.dir=${APP_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
